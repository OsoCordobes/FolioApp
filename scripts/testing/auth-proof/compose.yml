# CI-only extension of scripts/recovery/ci-compose.yml. The project network
# stays internal; neither SMTP nor its mailbox API publishes a Docker port.
services:
  auth:
    depends_on:
      inbucket: {condition: service_started}
    environment:
      GOTRUE_SITE_URL: http://localhost:4430
      GOTRUE_URI_ALLOW_LIST: http://localhost:4430/api/auth/callback,http://localhost:4430/reset-password
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_SMTP_ADMIN_EMAIL: auth-proof@example.test
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: "2500"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: Folio CI
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
  inbucket:
    image: inbucket/inbucket:3.0.3
