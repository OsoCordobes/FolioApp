# Folio · ejecución manual de /api/cron/dispatch-recordatorios.
# Vercel Pro ejecuta el worker cada minuto según vercel.json.
# Actions conserva sólo la invocación manual para operación autorizada.
#
# Requiere:
#   - Secret de Actions `CRON_SECRET` = mismo valor que en Vercel.
#   - (Opcional) Variable de Actions `APP_URL` si cambia el dominio.
#
name: Manual · dispatch-recordatorios

on:
  workflow_dispatch:

concurrency:
  group: dispatch-recordatorios
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invocar endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL != '' && vars.APP_URL || 'https://folio-app-ten.vercel.app' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret de Actions CRON_SECRET (mismo valor que en Vercel)." >&2
            exit 1
          fi
          curl --fail-with-body -sS -m 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/dispatch-recordatorios"
