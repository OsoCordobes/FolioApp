name: App CI (typecheck + lint + unit + build)

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-flight runs of the same ref when a new push lands.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ci:
    runs-on: ubuntu-latest

    env:
      # Claves de cifrado SOLO para tests (lib/crypto exige que existan).
      # Valores dummy de 32 bytes en base64 — nunca usar en runtime real.
      FOLIO_ENC_KEY: "Zm9saW8tY2ktZHVtbXktZW5jcnlwdGlvbi1rZXktMzI="
      FOLIO_ENC_HMAC_KEY: "Zm9saW8tY2ktZHVtbXktaG1hYy1rZXktMzItYnl0ZXM="

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Gate de build: una regresión de `next build` no debe descubrirse en
      # Vercel post-merge (master auto-deploya a prod). El build NO exige
      # envs de Supabase hoy (los accesos son lazy y las páginas SSG están
      # guarded), pero se inyectan dummies para paridad con el build de
      # Vercel (donde existen): así un futuro prerender que las lea no
      # rompe CI por `requireEnv` cuando en prod buildearía bien.
      # Valores dummy — nunca apuntan a un proyecto real.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
          SUPABASE_SERVICE_ROLE_KEY: "dummy"
