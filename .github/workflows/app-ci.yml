name: App CI (typecheck + lint + unit + build)

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-flight runs of the same ref when a new push lands.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Chromium for isolated walk-in smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify walk-in creation with synthetic server responses
        run: node tests/hoy/run-isolated.mjs browser-create

      - name: Render long clinical PDFs with synthetic data
        run: node tests/pdf/render-real.cjs

      - name: Recovery format tests (synthetic keys only)
        run: pnpm test:recovery

      # Isolated build: synthetic keys, local-only endpoints, no .env files or provider I/O.
      - name: Isolated build
        run: pnpm test:build
