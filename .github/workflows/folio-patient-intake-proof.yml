name: Folio B09 isolated patient intake proof

on:
  pull_request:
    paths:
      - .github/workflows/folio-patient-intake-proof.yml
      - scripts/testing/patient-intake-proof/**
      - tests/e2e/patient-intake-live.spec.ts
      - app/(public)/aporte/**
      - app/api/patient-intake/**
      - components/calendario/patient-intake-control.*
      - components/calendario/turno-detalle-modal.tsx
      - lib/patient-intake/**
      - lib/auth/route-decision.ts
      - middleware.ts
      - scripts/recovery/ci-compose.yml
      - scripts/recovery/ci-loopback-bridge.mjs
      - scripts/testing/app-config.mjs
      - scripts/testing/app-bootstrap.mjs
      - scripts/testing/isolation-policy.mjs
      - scripts/testing/browser-network.mjs
      - scripts/testing/run-browser.mjs
      - tests/fixtures/local-test.ts
      - supabase/migrations/*_M144_patient_intake_foundation.sql
      - supabase/migrations/*_M145_adult_attestation_revocation.sql
      - supabase/migrations/*_M146_patient_intake_portal_cancel.sql
      - supabase/migrations/*_M147_patient_intake_link_recovery.sql

permissions:
  contents: read

concurrency:
  group: folio-intake-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked tools
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Fetch exact official Supabase Docker release
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/supabase-upstream"
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch self-hosted/v0.8.1 https://github.com/supabase/supabase "$upstream"
          git -C "$upstream" sparse-checkout set docker
          test "$(git -C "$upstream" rev-parse HEAD)" = '8c7a4d9dbbaf8b552893822e89d7bf06f33f9220'
          echo "C01_OFFICIAL_DOCKER=$upstream/docker" >> "$GITHUB_ENV"
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Prove real intake journey on disposable Supabase
        run: node --conditions=react-server --import tsx scripts/testing/patient-intake-proof/run.mjs
      - name: Preserve sanitized result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-intake-proof-summary
          path: test-results/patient-intake-proof-summary.json
          if-no-files-found: ignore
