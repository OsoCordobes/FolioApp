name: Operational SQL proof PostgreSQL 17.11 (not for product PR)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA expected at checkout
        required: true
        type: string

permissions:
  contents: read

# One isolated operational object; never cancel an in-flight proof.
concurrency:
  group: folio-ops-pg1711-20261002
  cancel-in-progress: false

jobs:
  sql-specs:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'OsoCordobes/FolioApp' && github.ref == 'refs/tags/codex/ops-pg1711-20261002' && github.run_attempt == 1
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: folio_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify documentation-only PR from verified base
        id: docs
        shell: bash
        env:
          DOCS_ONLY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_ONLY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_ONLY_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          classify_docs_only() {
            [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] || return 0
            local base_sha="${DOCS_ONLY_BASE_SHA:-}" head_sha="${DOCS_ONLY_HEAD_SHA:-}" merge_sha="${DOCS_ONLY_MERGE_SHA:-}"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ && "$head_sha" =~ ^[0-9a-f]{40}$ && "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || return 0
            local actual_sha parents helper_entry trusted result
            actual_sha="$(git --no-replace-objects rev-parse --verify HEAD 2>/dev/null)" || return 0
            [[ "$actual_sha" == "$merge_sha" ]] || return 0
            parents="$(git --no-replace-objects show --no-patch --format=%P HEAD 2>/dev/null)" || return 0
            [[ "$parents" == "$base_sha $head_sha" ]] || return 0
            helper_entry="$(git --no-replace-objects ls-tree "$base_sha" -- scripts/ci/docs-only.mjs 2>/dev/null)" || return 0
            [[ "$helper_entry" =~ ^100644\ blob\ [0-9a-f]{40}$'\t'scripts/ci/docs-only\.mjs$ ]] || return 0
            trusted="$(mktemp "$RUNNER_TEMP/folio-docs-only-XXXXXX.mjs")" || return 0
            if git --no-replace-objects show "$base_sha:scripts/ci/docs-only.mjs" > "$trusted"; then
              if result="$(node "$trusted")" && [[ "$result" == "docs_only=true" ]]; then
                docs_only=true
              fi
            fi
            rm -- "$trusted"
          }
          classify_docs_only
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$GITHUB_REPOSITORY" == 'OsoCordobes/FolioApp' ]]
          [[ "$GITHUB_REF" == 'refs/tags/codex/ops-pg1711-20261002' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase hexadecimal SHA-1"
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" || "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checkout/event SHA differs from expected_sha"
            exit 1
          fi

      - name: Install psql client + pgTAP
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 postgresql-17-pgtap
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Verify isolated PostgreSQL 17.11 runtime
        if: steps.docs.outputs.docs_only != 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$PGHOST" == 'localhost' && "$PGPORT" == '5432' && "$PGDATABASE" == 'folio_test' && "$PGUSER" == 'postgres' ]]
          client_version="$(/usr/lib/postgresql/17/bin/psql --version)"
          [[ "$client_version" == 'psql (PostgreSQL) 17.'* ]]
          server_version_num="$(psql -X -At -v ON_ERROR_STOP=1 -c 'show server_version_num')"
          [[ "$server_version_num" == '170011' ]]
          printf 'repository=%s\nref=%s\nexpected_sha=%s\nGITHUB_SHA=%s\nclient=%s\nserver_version_num=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF" "$EXPECTED_SHA" "$GITHUB_SHA" "$client_version" "$server_version_num"
          psql -X -v ON_ERROR_STOP=1 -c 'select version(), current_database(), inet_server_addr(), inet_server_port();'

      - name: Bootstrap Supabase-compatible roles + auth schema stubs
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          # Folio · stubs minimos para correr migrations de Supabase contra
          # postgres vanilla. NO replica el comportamiento real de Supabase
          # Auth — solo crea los simbolos que las migrations referencian.
          # Esto es defensa contra drift de schema, NO un sustituto del
          # test E2E con `supabase start`.
          psql -X -v ON_ERROR_STOP=1 -f scripts/testing/supabase-stubs.sql

      - name: Apply migrations in lexicographic order
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          # Replay every migration with PostgreSQL default function checks.
          set -e
          for f in supabase/migrations/*.sql; do
            echo "::group::Applying $(basename "$f")"
            if [[ "$f" == *"_M118_billing_authority.sql" ]]; then
              psql -X -v ON_ERROR_STOP=1 -f tests/migrations/M118_ledger_transaction.sql
            fi
            if [[ "$f" == *"_M128_pedido_scoped_access.sql" ]]; then
              # Reproduce the existing org-wide leak on synthetic roles before
              # the fix. This assertion passes only when the old leak exists.
              psql -X -v ON_ERROR_STOP=1 -f tests/migrations/M128_pedido_before.sql
            fi
            if [[ "$f" == *"_M132_member_identity_immutable.sql" ]]; then
              # Prove the M130 opt-in can be forged by an Auth identity swap
              # before M132 closes that path. Synthetic rows are rolled back.
              psql -X -v ON_ERROR_STOP=1 -f tests/migrations/M132_member_identity_before.sql
            fi
            # The runner owns each migration transaction. Specs below retain
            # their own boundaries, including M91's transaction-local checks.
            psql --single-transaction -X -v ON_ERROR_STOP=1 -f "$f" || {
              echo "::error file=$f::Migration failed"
              exit 1
            }
            if [[ "$f" == *"_M128_pedido_scoped_access.sql" ]]; then
              # Old app SELECT contract stays available during expand.
              psql -X -v ON_ERROR_STOP=1 -f tests/migrations/M128_pedido_expand.sql
            fi
            echo "::endgroup::"
          done

      - name: Run SQL specs (tests/sql/*.spec.sql)
        if: steps.docs.outputs.docs_only != 'true'
        run: |
          set -e
          for f in tests/sql/*.spec.sql; do
            echo "::group::Spec $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -f "$f" || {
              echo "::error file=$f::Spec failed"
              exit 1
            }
            echo "::endgroup::"
          done

      - name: Set up Node for M142 concurrency spec
        if: steps.docs.outputs.docs_only != 'true' && hashFiles('tests/concurrency/M142_adult_attestation.mjs') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up locked pnpm
        if: steps.docs.outputs.docs_only != 'true' && hashFiles('tests/concurrency/M142_adult_attestation.mjs') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install locked test dependencies
        if: steps.docs.outputs.docs_only != 'true' && hashFiles('tests/concurrency/M142_adult_attestation.mjs') != ''
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run M142 real PostgreSQL row-lock races
        if: steps.docs.outputs.docs_only != 'true' && hashFiles('tests/concurrency/M142_adult_attestation.mjs') != ''
        timeout-minutes: 3
        env:
          FOLIO_M142_SYNTHETIC: '1'
        run: node tests/concurrency/M142_adult_attestation.mjs

      - name: Run M144 real PostgreSQL row-lock races
        if: steps.docs.outputs.docs_only != 'true' && hashFiles('tests/concurrency/M144_patient_intake.mjs') != ''
        timeout-minutes: 3
        env:
          FOLIO_M144_SYNTHETIC: '1'
        run: node tests/concurrency/M144_patient_intake.mjs

      - name: Summary
        if: always()
        env:
          DOCS_ONLY: ${{ steps.docs.outputs.docs_only }}
        run: |
          echo "## SQL tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Allowlisted Markdown-only PR. SQL migrations, specs and concurrency checks were NOT executed; zero migrations applied by this job." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- Migrations applied: $(ls supabase/migrations/*.sql | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Specs ejecutados: $(ls tests/sql/*.spec.sql | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NOTA: ensayo operativo postgres:17.11 por digest + stubs minimos de" >> "$GITHUB_STEP_SUMMARY"
          echo "auth/storage. NO reemplaza un test E2E con \`supabase start\`," >> "$GITHUB_STEP_SUMMARY"
          echo "que sigue siendo la fuente de verdad para RLS-with-JWT y" >> "$GITHUB_STEP_SUMMARY"
          echo "storage policies." >> "$GITHUB_STEP_SUMMARY"
