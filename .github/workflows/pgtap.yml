# Operational child for one intake UI/CAS proof tag. Exclude from release.
name: Folio M148 intake authenticated UI and CAS proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact full SHA of the reviewed intake UI/CAS operational tag commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m148-ui-cas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m148-ui-cas-proof:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/m148-ui-cas-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify dispatched tag and commit before services
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_REF" == refs/tags/m148-ui-cas-* ]]
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::expected_sha must be a full lowercase hexadecimal SHA-1'
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$DISPATCH_SHA" || "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo '::error::Checkout, dispatched tag SHA and expected_sha must match'
            exit 1
          fi
          echo "intake_incorporation_dispatch_commit=$actual_sha"
          echo "FOLIO_INTAKE_EXPECTED_SHA=$actual_sha" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked tools
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Fetch exact official Supabase Docker release
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/supabase-upstream"
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch self-hosted/v0.8.1 https://github.com/supabase/supabase "$upstream"
          git -C "$upstream" sparse-checkout set docker
          test "$(git -C "$upstream" rev-parse HEAD)" = '8c7a4d9dbbaf8b552893822e89d7bf06f33f9220'
          echo "C01_OFFICIAL_DOCKER=$upstream/docker" >> "$GITHUB_ENV"
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run only the three intake incorporation tests
        shell: bash
        run: |
          set -euo pipefail
          node --conditions=react-server --import tsx scripts/testing/patient-intake-proof/run.mjs --incorporation
      - name: Preserve finite synthetic intake incorporation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-intake-incorporation-receipt
          path: ${{ runner.temp }}/patient-intake-incorporation-receipt.json
          if-no-files-found: ignore
          retention-days: 7
